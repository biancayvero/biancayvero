<!doctype html>
<html lang="{{idioma}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="{{colorNavegador}}" />
    <title>{{titulo}}</title>
    <link rel="canonical" href="{{url}}" />
    <link rel="icon" href="{{favicon}}" />
    <link rel="apple-touch-icon" href="{{iconoApple}}" />
    <meta name="description" content="{{descripcion}}" />
    <meta property="og:locale" content="{{locale}}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{url}}" />
    <meta property="og:site_name" content="{{nombre}}" />
    <meta property="og:title" content="{{titulo}}" />
    <meta property="og:description" content="{{descripcion}}" />
    <meta property="og:image" content="{{imagenSocialAbsoluta}}" />
    <meta property="og:image:alt" content="{{descripcionImagenSocial}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{titulo}}" />
    <meta name="twitter:description" content="{{descripcion}}" />
    <meta name="twitter:image" content="{{imagenSocialAbsoluta}}" />
    <meta name="twitter:image:alt" content="{{descripcionImagenSocial}}" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
